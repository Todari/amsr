services:
  api:
    container_name: amsr-api
    build:
      context: ./server
    restart: unless-stopped
    environment:
      AMSR_API_TOKEN: ${AMSR_API_TOKEN:?AMSR_API_TOKEN is required}
      PORT: 8080
      AMSR_DATA_PATH: /data/applications.json
    ports:
      - "127.0.0.1:4311:8080"
    volumes:
      - amsr_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  amsr_data:
